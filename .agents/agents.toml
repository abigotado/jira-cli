[agents.orchestrator]
description = "Coordinate non-trivial jira-cli work through planning, advisory review, implementation, tests, review, and an independent second opinion."
prompt_file = "agents/orchestrator.md"
claude_model = "opus"
claude_tools = ["Read", "Grep", "Glob", "Bash", "Agent"]
claude_max_turns = 30
codex_model = "gpt-5.6-sol"
codex_reasoning_effort = "high"
read_only = true

[agents.planner]
description = "Produce dependency-ordered jira-cli implementation plans without editing files."
prompt_file = "agents/planner.md"
claude_model = "opus"
claude_tools = ["Read", "Grep", "Glob", "Bash", "Agent"]
claude_max_turns = 18
codex_model = "gpt-5.6-sol"
codex_reasoning_effort = "high"
read_only = true

[agents.advisor]
description = "Read-only adversarial review of a jira-cli implementation plan before any code is written."
prompt_file = "agents/advisor.md"
claude_model = "opus"
claude_tools = ["Read", "Grep", "Glob", "Bash"]
claude_max_turns = 18
codex_model = "gpt-5.6-sol"
codex_reasoning_effort = "high"
read_only = true

[agents.explorer]
description = "Trace jira-cli packages, commands, tests, and existing patterns with file and line evidence."
prompt_file = "agents/explorer.md"
claude_model = "haiku"
claude_tools = ["Read", "Grep", "Glob", "Bash"]
claude_max_turns = 20
codex_model = "gpt-5.6-terra"
codex_reasoning_effort = "medium"
read_only = true

[agents.coder]
description = "Implement scoped Go changes in jira-cli after planning."
prompt_file = "agents/coder.md"
claude_model = "sonnet"
claude_tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash"]
claude_max_turns = 40
codex_model = "gpt-5.6-terra"
codex_reasoning_effort = "high"
read_only = false

[agents.test-writer]
