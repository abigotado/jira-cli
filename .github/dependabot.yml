version: 2

updates:
  # Go modules. The dependency surface is deliberately tiny — Cobra and
  # x/term — so grouping everything into one PR keeps the noise low
  # while still surfacing an update promptly.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Actions are pinned by major tag, so this catches the security-relevant
  # moves that a floating tag would otherwise hide.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
