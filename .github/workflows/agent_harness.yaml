name: agent harness

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  harness:
    name: Harness consistency
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Pinned so a runner image bump cannot silently change the interpreter
          # the harness scripts run on.
          python-version: "3.12"

      - name: Generated mirrors must stay untracked
        run: |
          TRACKED=$(git ls-files .claude .codex)
          if [ -n "$TRACKED" ]; then
            echo "::error::Generated provider mirrors are committed. Remove them:"
            echo "$TRACKED"
            exit 1
          fi

      - name: Cursor mirrors are in sync
        run: python3 .agents/scripts/sync-rules.py --check

      - name: Harness unit tests
        run: python3 -m unittest discover -s .agents/tests -p 'test_*.py'

      # The provider compiler is not vendored — it lives in the machine-local
      # global harness, which a runner does not have. Compile determinism is
      # therefore a local pre-push check, not a CI check. What CI can still
      # enforce is that nobody vendored it back in without the duplication that
      # decision implies.
      - name: Provider compiler must stay unvendored
        run: |
          if [ -e .agents/scripts/compiler.py ]; then
            echo "::error::.agents/scripts/compiler.py is committed. The provider"
            echo "::error::compiler is intentionally the global ~/.agents one; see"
            echo "::error::.agents/README.md."
            exit 1
          fi
